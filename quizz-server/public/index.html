<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Super Quizz</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1420;color:#eee;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}
  #status{font-weight:700;}
  #status.ok{color:#4ade80;}
  #status.ko{color:#ff6b6b;}
  #msg{font-size:28px;margin-top:20px;}
</style>
</head>
<body>
<div>
  <p>Connexion : <span id="status">...</span></p>
  <div id="msg">En attente du jeu...</div>
</div>
<script>
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host + '/ws/viewer');
  const statusEl = document.getElementById('status');
  ws.onopen = () => { statusEl.textContent = 'connecté'; statusEl.className = 'ok'; };
  ws.onclose = () => { statusEl.textContent = 'déconnecté'; statusEl.className = 'ko'; };
  ws.onmessage = (ev) => {
    try {
      const data = JSON.parse(ev.data);
      document.getElementById('msg').textContent = data.text || JSON.stringify(data);
    } catch(e) {}
  };
</script>
</body>
</html>
